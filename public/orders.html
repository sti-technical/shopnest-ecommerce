<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders — ShopNest</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar" id="navbar"></nav>

<div class="container" style="max-width:760px; padding-top: 24px;">
  <h2 class="section-title" style="margin-top:12px;">My Orders</h2>
  <div id="placedMsg"></div>
  <div id="ordersList"></div>
</div>

<script src="js/app.js"></script>
<script>
if (!requireLogin()) { /* redirected */ }
renderNavbar('orders');

const params = new URLSearchParams(window.location.search);
const placedId = params.get('placed');
if (placedId) {
  document.getElementById('placedMsg').innerHTML =
    `<div class="form-msg success">🎉 Order #${escapeHtml(placedId)} placed successfully! Thank you for shopping with us.</div>`;
}

async function loadOrders() {
  const el = document.getElementById('ordersList');
  try {
    const orders = await apiFetch('/orders/my-orders');
    if (orders.length === 0) {
      el.innerHTML = `<div class="empty-state">No orders yet. <br><a href="index.html" class="btn btn-primary" style="margin-top:12px;">Start Shopping</a></div>`;
      return;
    }
    el.innerHTML = orders.map(order => `
      <div class="order-card">
        <div class="order-head">
          <div>
            <strong>Order #${order.id}</strong>
            <div style="color:var(--ink-soft); font-size:12.5px;">${new Date(order.created_at).toLocaleString()}</div>
          </div>
          <span class="status-badge">${escapeHtml(order.status)}</span>
        </div>
        ${order.items.map(item => `
          <div style="display:flex; gap:10px; align-items:center; padding:6px 0; font-size:13.5px;">
            <img src="${item.image}" style="width:40px;height:40px;object-fit:cover;border-radius:6px;">
            <span style="flex:1;">${escapeHtml(item.name)} × ${item.quantity}</span>
            <span>${formatPrice(item.price * item.quantity)}</span>
          </div>
        `).join('')}
        <div style="text-align:right; margin-top:8px; font-weight:700;">Total: ${formatPrice(order.total)}</div>
      </div>
    `).join('');
  } catch (e) {
    el.innerHTML = `<p class="form-msg error">Failed to load orders.</p>`;
  }
}

loadOrders();
</script>
</body>
</html>
