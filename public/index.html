<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopNest — Shop Smart</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="navbar" id="navbar"></nav>

<div class="hero">
  <h1>Welcome to ShopNest</h1>
  <p>Everyday essentials, delivered with care.</p>
</div>

<div class="container">
  <div class="filters">
    <input type="text" id="searchInput" placeholder="Search products...">
    <select id="categorySelect">
      <option value="">All Categories</option>
    </select>
  </div>

  <div id="alertBox"></div>
  <div class="product-grid" id="productGrid">
    <p>Loading products...</p>
  </div>
</div>

<footer>&copy; 2026 ShopNest. College mini-project.</footer>

<script src="/js/app.js"></script>
<script>
let allCategories = [];

async function loadCategories() {
  try {
    allCategories = await apiFetch('/products/categories');
    const sel = document.getElementById('categorySelect');
    allCategories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c; opt.textContent = c;
      sel.appendChild(opt);
    });
  } catch (e) { /* ignore */ }
}

function showAlert(msg, type = 'success') {
  const box = document.getElementById('alertBox');
  box.innerHTML = `<div class="alert alert-${type}">${escapeHtml(msg)}</div>`;
  setTimeout(() => { box.innerHTML = ''; }, 2500);
}

async function loadProducts() {
  const grid = document.getElementById('productGrid');
  const search = document.getElementById('searchInput').value.trim();
  const category = document.getElementById('categorySelect').value;
  const params = new URLSearchParams();
  if (search) params.set('search', search);
  if (category) params.set('category', category);

  try {
    const products = await apiFetch(`/products?${params.toString()}`);
    if (products.length === 0) {
      grid.innerHTML = '<div class="empty-state">No products found.</div>';
      return;
    }
    grid.innerHTML = products.map(p => `
      <div class="product-card">
        <img src="${escapeHtml(p.image)}" alt="${escapeHtml(p.name)}" onerror="this.src='https://via.placeholder.com/300x200?text=ShopNest'">
        <div class="info">
          <span class="cat">${escapeHtml(p.category)}</span>
          <h3>${escapeHtml(p.name)}</h3>
          <p class="desc">${escapeHtml(p.description)}</p>
          <div class="price-row">
            <span class="price">${formatPrice(p.price)}</span>
            <span class="stock ${p.stock <= 5 ? 'low' : ''}">${p.stock > 0 ? p.stock + ' in stock' : 'Out of stock'}</span>
          </div>
          <div class="card-actions">
            <button class="btn btn-outline" ${p.stock <= 0 ? 'disabled' : ''} onclick="addToCart(${p.id})">
              ${p.stock <= 0 ? 'Out of Stock' : 'Add to Cart'}
            </button>
            <button class="btn" ${p.stock <= 0 ? 'disabled' : ''} onclick="buyNow(${p.id})">
              Buy Now
            </button>
          </div>
        </div>
      </div>
    `).join('');
  } catch (e) {
    grid.innerHTML = `<div class="empty-state">Failed to load products: ${escapeHtml(e.message)}</div>`;
  }
}

async function addToCart(productId) {
  if (!isLoggedIn()) {
    window.location.href = '/login.html';
    return;
  }
  try {
    await apiFetch('/cart', { method: 'POST', body: JSON.stringify({ product_id: productId, quantity: 1 }) });
    showAlert('Added to cart!');
    renderNavbar();
  } catch (e) {
    showAlert(e.message, 'error');
  }
}

async function buyNow(productId) {
  if (!isLoggedIn()) {
    window.location.href = '/login.html';
    return;
  }
  try {
    // Orders just this one item directly — does not touch the cart
    const order = await apiFetch('/orders/buy-now', { method: 'POST', body: JSON.stringify({ product_id: productId, quantity: 1 }) });
    showAlert(`Order #${order.id} placed successfully!`);
    setTimeout(() => { window.location.href = '/orders.html'; }, 1200);
  } catch (e) {
    showAlert(e.message, 'error');
  }
}

document.getElementById('searchInput').addEventListener('input', debounce(loadProducts, 300));
document.getElementById('categorySelect').addEventListener('change', loadProducts);

function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

loadCategories();
loadProducts();
</script>
</body>
</html>
